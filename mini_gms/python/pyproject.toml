# pyproject.toml - packaging metadata for the mini_gms Python package.
#
# The package is a thin ctypes wrapper around the mini_gms shared library.
# The shared library itself is produced by the CMake build at the repository
# root and must be placed next to this package's source files before
# `pip install .` so that it can be bundled into the wheel.

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini_gms"
version = "1.0.0"
description = "mini_gms parser for Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["mini_gms"]

[tool.setuptools.package-data]
mini_gms = ["*.dll", "*.so", "*.dylib"]